name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *" # todo dia 00:00 (horário de Brasília)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Iagodizlla&theme=holi&count_private=true&hide=stars
          path: profile/stats.svg
          token: ${{ secrets.GRS_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Iagodizlla&layout=compact&langs_count=7&theme=holi
          path: profile/top-langs.svg
          token: ${{ secrets.GRS_TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
